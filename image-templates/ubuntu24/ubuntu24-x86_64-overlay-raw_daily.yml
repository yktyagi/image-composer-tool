    - autoconf
    - automake
    - libtool
    - cmake
    - g++
    - gcc
    - git
    - intel-gpu-tools
    # We request the real package libssl3t64 directly (not the virtual "libssl3",
    # which on noble is just a Provides alias), UNPINNED. libssl-dev strictly
    # "Depends: libssl3t64 (= <its own version>)"; both are unpinned, so both
