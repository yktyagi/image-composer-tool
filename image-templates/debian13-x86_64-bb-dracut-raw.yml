# AI-searchable metadata for template discovery
metadata:
  description: Debian 13 minimal raw image with initrd hello hook via dracut-core (GRUB)
  use_cases:
    - Validating custom dracut module scripts on Debian GRUB raw images
    - Lightweight Debian with early-boot initrd marker
  keywords:
    - bb
    - dracut
    - dracut-core
    - initrd
    - hello
    - debian
    - grub
    - raw

image:
  name: bb-os-image-debian-dracut
  version: "13.0"

target:
  os: debian
  dist: debian13
  arch: x86_64
  imageType: raw

disk:
  name: Minimal_Raw # 1:1 mapping to the systemConfigs name
  artifacts:
    -
      type: raw  # image file format, valid value [raw, vhd, vhdx, qcow2, vmdk, vdi]
      compression: gz # image compression format (optional)
    - type: vhdx
  size: 4GiB # 4G, 4GB, 4096 MiB also valid. (Required for raw)
  partitionTableType: gpt # Partition table type, valid value: [gpt, mbr]
  partitions: # Required for raw, optional for ISO, not needed for rootfs.
    - id: boot
      type: esp
      flags:
        - esp
        - boot
      start: 1MiB
      end: 513MiB
      fsType: fat32
      mountPoint: /boot/efi
      mountOptions: umask=0077

    - id: rootfs
      type: linux-root-amd64
      start: 513MiB
      end: "0"
      fsType: ext4
      mountPoint: /
      mountOptions: defaults

systemConfig:
  name: bb-dracut
  description: Minimal debian raw image with initrd hello (dracut-core, GRUB)

  bootloader:
    bootType: efi
    provider: grub

  immutability:
    enabled: false

  packages:
    - apparmor
    - apt-listchanges
    - apt-utils
    - bash-completion
    - bind9-host
    - cloud-init
    - curl
    - dbus
    - dosfstools
    - dracut
    - dracut-core
    - firmware-intel-graphics
    - firmware-intel-misc
    - firmware-iwlwifi
    - grub-cloud-amd64
    - init
    - iptables
    - iputils-ping
    - less
    - libext2fs2t64
    - liblastlog2-2
    - libnss-myhostname
    - libnss-resolve
    - libpam-modules-bin
    - libpam-systemd
    - libss2
    - linux-sysctl-defaults
    - man-db
    - manpages
    - mawk
    - nano
    - netplan.io
    - pciutils
    - polkitd
    - psmisc
    - python3-minimal
    - reportbug
    - wireless-regdb
    - screen
    - socat
    - ssh-import-id
    - sudo
    - tcpdump
    - traceroute
    - unattended-upgrades
    - uuid-runtime
    - vim
    - vim-tiny
    - whiptail
    - zstd
    # ---------------------------------------------------------------------------
    # X11 graphics stack. See the additionalFiles/configurations below for why
    # X11 (not Wayland) — Debian 13's gnome-session ships no X11 session file,
    # so gnome-xorg.desktop below supplies the missing launcher rather than a
    # package providing it.
    # ---------------------------------------------------------------------------
    - xserver-xorg
    - xserver-xorg-video-all
    - xserver-xorg-input-all
    - xinit
    - x11-xserver-utils
    - x11-utils
    - libgl1-mesa-dri
    - libglx-mesa0
    - mesa-utils
    - mesa-vulkan-drivers
    - fonts-dejavu-core
    - libgtk-3-0
    - gdm3
    - gnome-session
    - gnome-shell
    - gnome-terminal
    - gnome-software

  additionalFiles:
    - local: additionalfiles/debian13-bb-dracut/modules.d/91hello/module-setup.sh
      final: /usr/lib/dracut/modules.d/91hello/module-setup.sh
    - local: additionalfiles/debian13-bb-dracut/modules.d/91hello/hello.sh
      final: /usr/lib/dracut/modules.d/91hello/hello.sh
    - local: additionalfiles/debian13-bb-dracut/modules.d/91hello/initqueue-sample.sh
      final: /usr/lib/dracut/modules.d/91hello/initqueue-sample.sh
    # X11, not Wayland — see debian13-x86_64-bb-graphics-raw.yml for the full
    # rationale (Debian 13's gnome-session ships Wayland-only; gnome-shell's
    # X11 backend still works, it's just missing the xsessions launcher; and
    # gnome-shell's default experimental Mutter features have a known
    # click-coordinate-mapping bug this dconf override disables).
    - local: additionalfiles/debian13-bb-graphics-x11/usr/share/xsessions/gnome-xorg.desktop
      final: /usr/share/xsessions/gnome-xorg.desktop
    - local: additionalfiles/debian13-bb-graphics-mutter/etc/dconf/profile/user
      final: /etc/dconf/profile/user
    - local: additionalfiles/debian13-bb-graphics-mutter/etc/dconf/db/local.d/00-mutter
      final: /etc/dconf/db/local.d/00-mutter
    - local: additionalfiles/debian13-bb-graphics-mutter/etc/systemd/system/dconf-update-mutter.service
      final: /etc/systemd/system/dconf-update-mutter.service

  configurations:
    - cmd: 'mkdir -p /etc/dracut.conf.d && echo ''add_dracutmodules+=" hello "'' > /etc/dracut.conf.d/91hello.conf'
    - cmd: "chmod 755 /usr/lib/dracut/modules.d/91hello/module-setup.sh /usr/lib/dracut/modules.d/91hello/hello.sh /usr/lib/dracut/modules.d/91hello/initqueue-sample.sh"
    - cmd: "printf 'Package: systemd-boot systemd-boot-efi\\nPin: release *\\nPin-Priority: -1\\n' > /etc/apt/preferences.d/no-systemd-boot"
    - cmd: "dpkg --purge --force-all systemd-boot systemd-boot-efi 2>/dev/null || true"
    # Graphical login: gdm3 is WantedBy=graphical.target, so the default target
    # must switch from multi-user.target or gdm never starts (see
    # debian13-x86_64-bb-graphics-raw.yml for the fuller explanation).
    - cmd: 'systemctl set-default graphical.target'
    - cmd: 'systemctl enable gdm3'
    # Remove the Wayland session files gnome-session ships, so GDM has exactly
    # one session (X11) to offer — no ambiguity, no accidental Wayland fallback.
    - cmd: 'rm -f /usr/share/wayland-sessions/gnome.desktop /usr/share/wayland-sessions/gnome-wayland.desktop'
    # Enable the first-boot dconf compile: this symlink's target is delivered by
    # additionalFiles, which in create mode may not have landed yet at this point
    # in the build — a symlink doesn't need its target to exist until boot time.
    - cmd: 'mkdir -p /etc/systemd/system/multi-user.target.wants && ln -sf /etc/systemd/system/dconf-update-mutter.service /etc/systemd/system/multi-user.target.wants/dconf-update-mutter.service'

  kernel:
    cmdline: "console=ttyS0,115200 console=tty0 loglevel=7 rd.debug rd.info"
    packages:
      - linux-image-amd64
