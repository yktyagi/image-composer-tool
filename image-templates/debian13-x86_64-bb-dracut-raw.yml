# AI-searchable metadata for template discovery
metadata:
  description: Debian 13 raw image with initrd hello hook via dracut-core (GRUB) and a GNOME/X11 desktop
  use_cases:
    - Validating custom dracut module scripts on Debian GRUB raw images
    - Lightweight Debian with early-boot initrd marker
    - Booting into a GNOME-on-Xorg desktop session (GDM login)
    - Running a one-time setup script on the device's first boot
  keywords:
    - bb
    - dracut
    - dracut-core
    - initrd
    - hello
    - debian
    - grub
    - raw
    - gnome
    - x11
    - gdm
    - desktop
    - first-boot
    - oneshot

image:
  name: bb-os-image-debian-dracut
  version: "13.1"

target:
  os: debian
  dist: debian13
  arch: x86_64
  imageType: raw

disk:
  name: Minimal_Raw # 1:1 mapping to the systemConfigs name
  artifacts:
    -
      type: raw  # image file format, valid value [raw, vhd, vhdx, qcow2, vmdk, vdi]
      compression: gz # image compression format (optional)
    - type: vhdx
  size: 4GiB # 4G, 4GB, 4096 MiB also valid. (Required for raw)
  partitionTableType: gpt # Partition table type, valid value: [gpt, mbr]
  partitions: # Required for raw, optional for ISO, not needed for rootfs.
    - id: boot
      type: esp
      flags:
        - esp
        - boot
      start: 1MiB
      end: 513MiB
      fsType: fat32
      mountPoint: /boot/efi
      mountOptions: umask=0077

    - id: rootfs
      type: linux-root-amd64
      start: 513MiB
      end: "0"
      fsType: ext4
      mountPoint: /
      mountOptions: defaults

# Local apt repo for the locally-built Intel-patched QEMU package (replaces
# the standard qemu-system-x86/qemu-utils/qemu-guest-agent packages — see
# the allowPackages/packages comment below for why). ICT generates the
# Packages/Release metadata itself (dpkg-scanpackages) from whatever .deb
# files sit in `path` — no need to hand-build an apt repo.
packageRepositories:
  - codename: "qemu-intel-local"
    # Hardcoded local path — update to wherever the qemu-intel .deb lives on
    # your build machine.
    path: "/home/repos/localdeb2"
    pkey: "[trusted=yes]"
    component: "main"
    priority: 2000
    allowPackages:
      - qemu-intel

systemConfig:
  name: bb-dracut
  description: Minimal debian raw image with initrd hello (dracut-core, GRUB)

  bootloader:
    bootType: efi
    provider: grub

  immutability:
    enabled: false

  packages:
    - apparmor
    - apt-listchanges
    - apt-utils
    - bash-completion
    - bind9-host
    - cloud-init
    - curl
    - dbus
    - dosfstools
    - dracut
    - dracut-core
    - firmware-intel-graphics
    - firmware-intel-misc
    - firmware-iwlwifi
    # gcc/linux-libc-dev/python3-dev/python3-venv (below): build prerequisites
    # for install-debian.sh's install_ucc_venv(), which creates the ucc venv
    # and pip-installs evdev (needs a C compiler + headers). The script
    # assumes these already exist rather than installing them itself, and
    # since packages here install before configurations/the script run, they
    # have to be declared here.
    - gcc
    - grub-cloud-amd64
    - init
    - iptables
    - iputils-ping
    - less
    - libext2fs2t64
    - liblastlog2-2
    - libnss-myhostname
    - libnss-resolve
    - libpam-modules-bin
    - libpam-systemd
    - libss2
    - linux-libc-dev
    - linux-sysctl-defaults
    - man-db
    - manpages
    - mawk
    - nano
    - netplan.io
    - pciutils
    - polkitd
    - psmisc
    - python3-dev
    - python3-minimal
    - python3-venv
    - reportbug
    - wireless-regdb
    - screen
    - socat
    - ssh-import-id
    - sudo
    - tcpdump
    - traceroute
    - unattended-upgrades
    - uuid-runtime
    - vim
    - vim-tiny
    - wget
    # Intel-patched QEMU 9.1.0, from the local repo above (priority 2000
    # makes the resolver prefer it; it also bundles what qemu-system-x86/
    # qemu-utils/qemu-guest-agent normally provide, so those aren't listed).
    - qemu-intel
    - whiptail
    - zstd
    # ---------------------------------------------------------------------------
    # X11 graphics stack. See the additionalFiles/configurations below for why
    # X11 (not Wayland) — Debian 13's gnome-session ships no X11 session file,
    # so gnome-xorg.desktop below supplies the missing launcher rather than a
    # package providing it.
    # ---------------------------------------------------------------------------
    - xserver-xorg
    - xserver-xorg-video-all
    - xserver-xorg-input-all
    - xinit
    - x11-xserver-utils
    - x11-utils
    - libgl1-mesa-dri
    - libglx-mesa0
    - mesa-utils
    - mesa-vulkan-drivers
    - fonts-dejavu-core
    - libgtk-3-0
    - gdm3
    - gnome-session
    - gnome-shell
    - gnome-terminal
    - gnome-software

  additionalFiles:
    - local: additionalfiles/debian13-bb-dracut/modules.d/91hello/module-setup.sh
      final: /usr/lib/dracut/modules.d/91hello/module-setup.sh
    - local: additionalfiles/debian13-bb-dracut/modules.d/91hello/hello.sh
      final: /usr/lib/dracut/modules.d/91hello/hello.sh
    - local: additionalfiles/debian13-bb-dracut/modules.d/91hello/initqueue-sample.sh
      final: /usr/lib/dracut/modules.d/91hello/initqueue-sample.sh
    # X11, not Wayland — Debian 13's gnome-session ships Wayland-only;
    # gnome-shell's X11 backend still works, it's just missing the xsessions
    # launcher, supplied below. The dconf override below also disables a
    # known Mutter click-coordinate-mapping bug (see 00-mutter for detail).
    - local: additionalfiles/debian13-bb-graphics-x11/usr/share/xsessions/gnome-xorg.desktop
      final: /usr/share/xsessions/gnome-xorg.desktop
    - local: additionalfiles/debian13-bb-graphics-mutter/etc/dconf/profile/user
      final: /etc/dconf/profile/user
    - local: additionalfiles/debian13-bb-graphics-mutter/etc/dconf/db/local.d/00-mutter
      final: /etc/dconf/db/local.d/00-mutter
    # UCC VM-control keyboard shortcuts. The install-debian.sh invocation
    # below stages /usr/lib/ucc/app (including the built venv/dist/vmsetup
    # binary) and enables ucc-init.service, which copies it to /ucc/app at
    # first boot — so all 5 shortcuts (VMControl + Shift+Super+1-4) resolve
    # once the device boots.
    - local: additionalfiles/debian13-bb-graphics-mutter/etc/dconf/db/local.d/01-custom-keybindings
      final: /etc/dconf/db/local.d/01-custom-keybindings
    - local: additionalfiles/debian13-bb-graphics-mutter/etc/systemd/system/dconf-update-mutter.service
      final: /etc/systemd/system/dconf-update-mutter.service
    # Sample script that runs once on the device's first boot only (see
    # first-boot-sample.service's ConditionPathExists marker file).
    - local: additionalfiles/debian13-bb-dracut/usr/local/sbin/first-boot-sample.sh
      final: /usr/local/sbin/first-boot-sample.sh
    - local: additionalfiles/debian13-bb-dracut/etc/systemd/system/first-boot-sample.service
      final: /etc/systemd/system/first-boot-sample.service
    # UCC app source tree (c4v-0918), packaged as a single tarball since
    # additionalFiles only supports one file -> one destination (no
    # recursive directory staging). The "-patched" suffix marks that this is
    # NOT the raw BB team drop: it has the chroot-safety fixes applied to
    # scripts/install-debian.sh (see the configurations comment below).
    # Hardcoded absolute local path for now — BB team is refactoring their
    # build into a separate download phase that will publish this as a
    # proper artifact; until that lands, update `local:` below to wherever
    # your patched copy lives on your build machine. The tarball's internal
    # top-level directory is named "c4v" (not "c4v-0918"), hence /opt/c4v/c4v
    # below.
    - local: /home/repos/c4v-0918-patched.tar.gz
      final: /opt/c4v/c4v-0918-patched.tar.gz

  configurations:
    # Stage the UCC app tree from the tarball above, then run its installer.
    # install-debian.sh now owns: OVMF staging, swagger-ui download, the ucc
    # Python venv, the Xorg pageflip config, the xhost Xsession script, the
    # GRUB timeout drop-in, and the usb2qemu/drm2qemu udev rules + dracut
    # include — all previously duplicated here by hand. It's been patched
    # for chroot use (add_gnome_keyboard_shortcuts and the trailing
    # update-grub removed — see install-debian.sh's own comments for why).
    - cmd: 'mkdir -p /opt/c4v && tar xzf /opt/c4v/c4v-0918-patched.tar.gz -C /opt/c4v'
    - cmd: 'cd /opt/c4v/c4v && bash scripts/install-debian.sh'
    - cmd: 'mkdir -p /etc/dracut.conf.d && echo ''add_dracutmodules+=" hello "'' > /etc/dracut.conf.d/91hello.conf'
    - cmd: "chmod 755 /usr/lib/dracut/modules.d/91hello/module-setup.sh /usr/lib/dracut/modules.d/91hello/hello.sh /usr/lib/dracut/modules.d/91hello/initqueue-sample.sh"
    - cmd: "printf 'Package: systemd-boot systemd-boot-efi\\nPin: release *\\nPin-Priority: -1\\n' > /etc/apt/preferences.d/no-systemd-boot"
    - cmd: "dpkg --purge --force-all systemd-boot systemd-boot-efi 2>/dev/null || true"
    # Graphical login: gdm3 is WantedBy=graphical.target, so the default target
    # must switch from multi-user.target or gdm never starts.
    - cmd: 'systemctl set-default graphical.target'
    - cmd: 'systemctl enable gdm3'
    # Force GDM to X11-only via its own conffile toggle, not by deleting
    # gnome-session's Wayland .desktop files: those are plain package data,
    # so unattended-upgrades could restore them on a later gnome-session
    # upgrade, but /etc/gdm3/daemon.conf is a dpkg conffile and this edit
    # survives that upgrade. (Debian 13's gdm3 48.0-2 renamed the old
    # custom.conf to daemon.conf.)
    - cmd: "sed -i 's/^#WaylandEnable=false/WaylandEnable=false/' /etc/gdm3/daemon.conf"
    # Enable the first-boot dconf compile unit delivered by additionalFiles above.
    - cmd: 'systemctl enable dconf-update-mutter.service'
    - cmd: "chmod 755 /usr/local/sbin/first-boot-sample.sh"
    - cmd: 'systemctl enable first-boot-sample.service'

  kernel:
    cmdline: "console=ttyS0,115200 console=tty0 loglevel=7 rd.debug rd.info"
    packages:
      - linux-image-amd64
